[package]
name = "streamstrike"
version = "0.1.0"
edition = "2024"
description = "Local scene and source project editor for a future StreamStrike recording application"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
eframe = { version = "=0.30.0", default-features = false, features = ["default_fonts", "wgpu", "x11"] }
rfd = "=0.15.4"
image = { version = "=0.25.10", default-features = false, features = ["png"] }

[[bin]]
name = "streamstrike"
path = "src/main.rs"

[[bin]]
name = "streamstrike-editor"
path = "src/bin/editor.rs"

