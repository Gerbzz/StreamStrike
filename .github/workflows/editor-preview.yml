name: Native project editor

on:
  push:
    branches: [codex/streamstrike-project-editor, codex/streamstrike-native-capture-20261018]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  editor:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify clean locked dependency graph
        shell: pwsh
        run: |
          cargo metadata --locked --format-version 1 | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Locked metadata resolution failed' }
          git diff --exit-code -- Cargo.lock
          if ($LASTEXITCODE -ne 0) { throw 'Cargo.lock changed on clean checkout' }
      - name: Test project core, document state, and editor source
        shell: pwsh
        run: |
          cargo test --locked --all-targets
          if ($LASTEXITCODE -ne 0) { throw 'Rust tests failed' }
          cargo build --locked --bin streamstrike-editor
          if ($LASTEXITCODE -ne 0) { throw 'Native editor build failed' }
      - name: Attempt real native app-only capture
        shell: pwsh
        run: |
          $signature = @'
          using System;
          using System.Runtime.InteropServices;
          public static class EditorWindow {
            [DllImport("user32.dll")] public static extern bool ShowWindow(IntPtr handle, int command);
            [DllImport("user32.dll")] public static extern bool EnumWindows(WindowCallback callback, IntPtr data);
            [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr handle, out uint processId);
            public delegate bool WindowCallback(IntPtr handle, IntPtr data);
            public static IntPtr FindWindow(int processId) {
              IntPtr found = IntPtr.Zero;
              EnumWindows((handle, data) => {
                uint owner;
                GetWindowThreadProcessId(handle, out owner);
                if (owner == (uint)processId) { found = handle; return false; }
                return true;
              }, IntPtr.Zero);
              return found;
            }
          }
          '@
          Add-Type -TypeDefinition $signature
          $folder = Join-Path $env:RUNNER_TEMP 'streamstrike-editor-evidence'
          New-Item -ItemType Directory -Path $folder -Force | Out-Null
          $image = Join-Path $folder 'streamstrike-editor.png'
          $stderr = Join-Path $folder 'editor-stderr.txt'
          $stdout = Join-Path $folder 'editor-stdout.txt'
          $sample = Join-Path $env:GITHUB_WORKSPACE 'docs\evidence\demo.streamstrike'
          $app = Join-Path $env:GITHUB_WORKSPACE 'target\debug\streamstrike-editor.exe'
          $process = Start-Process -FilePath $app -ArgumentList @('--open', $sample, '--capture', $image) -RedirectStandardError $stderr -RedirectStandardOutput $stdout -PassThru
          try {
            for ($try = 0; $try -lt 20; $try++) {
              Start-Sleep -Milliseconds 500
              $process.Refresh()
              if ($process.HasExited) { break }
              $window = [EditorWindow]::FindWindow($process.Id)
              if ($window -ne [IntPtr]::Zero) {
                [EditorWindow]::ShowWindow($window, 5) | Out-Null
                break
              }
            }
            Wait-Process -Id $process.Id -Timeout 30 -ErrorAction SilentlyContinue
          } finally {
            $process.Refresh()
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
          $process.Refresh()
          if (Test-Path -LiteralPath $image) {
            $file = Get-Item -LiteralPath $image
            if ($file.Length -lt 10000 -or $file.Length -gt 5MB) { throw 'Captured PNG has unexpected size' }
            "Native app-only screenshot from $env:GITHUB_SHA; synthetic selectors; no devices opened." | Set-Content -LiteralPath (Join-Path $folder 'provenance.txt')
          } else {
            "Native window capture unavailable at $env:GITHUB_SHA; process exit $($process.ExitCode)." | Set-Content -LiteralPath (Join-Path $folder 'provenance.txt')
          }
      - uses: actions/upload-artifact@v4
        with:
          name: streamstrike-editor-${{ github.sha }}
          path: ${{ runner.temp }}/streamstrike-editor-evidence/
          if-no-files-found: error
          retention-days: 1

  capture-evidence:
    needs: editor
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
      WGPU_BACKEND: vulkan
    steps:
      - uses: actions/checkout@v4
      - name: Install official X11 keymap and Mesa software Vulkan runtimes
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libxkbcommon-x11-0 mesa-vulkan-drivers
          ldconfig -p | grep 'libxkbcommon-x11.so.0'
          icd="$(dpkg -L mesa-vulkan-drivers | grep -E '/lvp_icd[^/]*\.json      - name: Verify clean locked dependency graph
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --locked --format-version 1 > /dev/null
          git diff --exit-code -- Cargo.lock
      - name: Test source and build actual native editor
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --all-targets
          cargo build --locked --bin streamstrike-editor
          git diff --exit-code -- Cargo.lock
      - name: Capture actual WGPU editor under Xvfb
        shell: bash
        run: |
          set -euo pipefail
          folder="$RUNNER_TEMP/streamstrike-linux"
          mkdir -p "$folder"
          png="$folder/streamstrike-editor.png"
          timeout 40s xvfb-run -a -s '-screen 0 1280x800x24' \
            "$PWD/target/debug/streamstrike-editor" \
            --open "$PWD/docs/evidence/demo.streamstrike" \
            --capture "$png" > "$folder/editor-stdout.txt" 2> "$folder/editor-stderr.txt" || {
              cat "$folder/editor-stderr.txt"
              exit 1
            }
          test -s "$png"
          bytes="$(stat -c%s "$png")"
          test "$bytes" -ge 10000
          test "$bytes" -le 5242880
          STREAMSTRIKE_NATIVE_CAPTURE_PATH="$png" cargo test --locked --test native_capture_gate native_editor_png_has_rendered_detail -- --exact --ignored --nocapture
          printf 'Actual StreamStrike WGPU editor at %s; synthetic selectors; software Vulkan Lavapipe under Xvfb; no devices opened.\n' "$GITHUB_SHA" > "$folder/provenance.txt"
          sha256sum "$png"
          echo PNG_BASE64_BEGIN
          base64 -w0 "$png"
          echo
          echo PNG_BASE64_END
          git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: streamstrike-linux-native-${{ github.sha }}
          path: ${{ runner.temp }}/streamstrike-linux/
          if-no-files-found: warn
          retention-days: 1
 | head -n 1)"
          test -n "$icd"
          test -f "$icd"
          ls -l "$icd"
          printf 'VK_DRIVER_FILES=%s\n' "$icd" >> "$GITHUB_ENV"
      - name: Verify clean locked dependency graph
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --locked --format-version 1 > /dev/null
