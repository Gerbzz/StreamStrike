name: OBS source foundation
on:
  pull_request:
    paths: ['foundation/**', 'tools/obs_foundation.py', 'tools/obs_branding.py', 'tools/obs_runtime.py', 'tools/obs_components.py', 'tools/verify_obs_fader.py', 'tools/obs_capture.sh', 'tools/verify_obs_capture.py', 'tests/branding/**', 'tests/rust_fader/**', 'assets/branding/StreamStrike-logo.png', 'tests/test_obs_*.py', 'evidence/upstream/**', '.github/workflows/obs-foundation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-obs:
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Require existing Rust compiler for the runtime port
        run: rustc --version
      - name: Test source guardrails
        run: python3 -m unittest discover -s tests -p 'test_obs_*.py' -v
      - name: Check out official OBS source and pinned submodules
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: obsproject/obs-studio
          ref: 72e86655715d9a25d69ce446aa4dd44ba58e10d2
          path: foundation/obs-studio
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - name: Verify actual source before executing it
        run: python3 tools/obs_foundation.py verify
      - name: Prepare and verify isolated hash-locked branding source
        run: python3 tools/obs_branding.py prepare
      - name: Build original OBS frontend and engine using upstream entrypoint
        uses: ./foundation/obs-studio/.github/actions/build-obs
        with:
          workingDirectory: ${{ github.workspace }}/foundation/obs-studio
          target: x86_64
          config: RelWithDebInfo
      - name: Build relocatable developer entrypoint from original preset
        # Upstream build has already prepared system dependencies and cached CEF_ROOT_DIR.
        run: python3 tools/obs_foundation.py build
      - name: Verify build output and record source evidence
        run: |
          set -euo pipefail
          test -x foundation/obs-studio/build_ubuntu/install/RelWithDebInfo/bin/obs
          mkdir -p obs-build-evidence
          ninja -C foundation/obs-studio/build_ubuntu -t commands libobs/CMakeFiles/libobs.dir/obs-audio-controls.c.o > obs-build-evidence/original-audio-compile-command.txt
          cc -v > obs-build-evidence/compiler-version.txt 2>&1
          cc -Q --help=target > obs-build-evidence/compiler-target-defaults.txt
          cc -Q --help=optimizers > obs-build-evidence/compiler-optimizer-defaults.txt
          ldd foundation/obs-studio/build_ubuntu/install/RelWithDebInfo/bin/obs | tee obs-build-evidence/loader.txt
          if grep -q 'not found' obs-build-evidence/loader.txt; then
            echo 'Original OBS developer executable has unresolved runtime libraries' >&2
            exit 1
          fi
          cp foundation/obs-source.lock.json obs-build-evidence/
          git -C foundation/obs-studio rev-parse HEAD > obs-build-evidence/obs-commit.txt
          git -C foundation/obs-studio describe --always --tags --dirty=-modified > obs-build-evidence/obs-version.txt
          git -C foundation/obs-studio submodule status --recursive > obs-build-evidence/submodules.txt
          sha256sum foundation/obs-studio/build_ubuntu/install/RelWithDebInfo/bin/obs > obs-build-evidence/executable.sha256
          printf '%s\n' 'Original C/C++ OBS compiled. Not a Rust rewrite, native acceptance, or release.' > obs-build-evidence/status.txt
      - name: Upload build provenance only (no binary release)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: obs-source-build-evidence
          path: obs-build-evidence
          if-no-files-found: error
      - name: Install standard ephemeral X11 and SVG runtime tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y xvfb openbox stalonetray x11-utils qt6-svg-plugins
      - name: Build and exercise shared Qt identity contracts
        run: |
          cmake -S tests/branding -B build-branding-test -G Ninja
          cmake --build build-branding-test
          QT_QPA_PLATFORM=offscreen build-branding-test/streamstrike-icon-contract
      - name: Build actual OBS frontend with the reviewed branding overlay
        run: python3 tools/obs_branding.py build
      - name: Verify complete original and migrated cubic IEC logarithmic public APIs
        run: python3 tools/verify_obs_fader.py
      - name: Retain all-three-fader runtime parity evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: streamstrike-fader-${{ github.sha }}
          path: |
            obs-fader-evidence
            foundation/streamstrike-obs/build_ubuntu/libobs/libstreamstrike-fader.profile.json
            foundation/streamstrike-obs/build_ubuntu/compile_commands.json
          if-no-files-found: warn
      - name: Capture actual branded native frontend and verify identities
        run: tools/obs_capture.sh
      - name: Retain branding capture and diagnostics (no binary release)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: streamstrike-obs-native-${{ github.sha }}
          path: obs-branding-evidence
          if-no-files-found: warn
